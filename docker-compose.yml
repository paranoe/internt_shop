services:
  postgres:
    image: postgres:16-alpine
    container_name: marketplace_postgres
    restart: always
    environment:
      POSTGRES_DB: marketplace_db
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace_pass
    ports:
      - "5432:5432"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./docker/db:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: marketplace_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: internt-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: marketplace_db
      DB_USER: marketplace
      DB_PASSWORD: marketplace_pass
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: super_secret_key
    depends_on:
      - postgres
      - redis

volumes:
  pgdata: